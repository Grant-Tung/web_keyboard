<!doctype html>
<html lang="vi" data-type="product" data-radius="round" data-buttons="solid" data-motion>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sản phẩm | KeyHouse</title>
<meta name="description" content="Chọn màu, chọn switch và nghe thử tiếng gõ trước khi mua. Cọc 100.000đ, COD toàn quốc.">
<meta name="site-kind" content="tech">
<meta name="page-type" content="product">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="assets/system.css">
<link rel="stylesheet" href="assets/motion/motion.css">
<link rel="stylesheet" href="assets/layout/layout.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="nav">
  <div class="wrap nav__bar">
    <a class="nav__logo" href="index.html"><span class="mark" data-mark="stack" aria-hidden="true"></span>KeyHouse</a>
    <nav class="nav__links" aria-label="Chính">
      <div class="nav__item"><a class="nav__link" href="index.html#catalog">Bàn phím</a></div>
      <div class="nav__item"><a class="nav__link" href="product.html?id=aula-sc620">Chuột</a></div>
      <div class="nav__item"><a class="nav__link" href="#specs">Thông số</a></div>
    </nav>
    <div class="nav__actions">
      <button class="cart-btn" type="button" aria-label="Mở giỏ hàng">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <span class="cart-btn__n"></span>
      </button>
    </div>
    <button class="nav__toggle" type="button" aria-expanded="false" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 5h14M2 13h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<main class="pdp">
  <div class="wrap pdp__grid">
    <div class="gallery">
      <div class="gallery__main"><img id="main-img" alt=""></div>
      <div class="gallery__thumbs" role="group" aria-label="Ảnh sản phẩm" id="thumbs"></div>
    </div>

    <div class="buy">
      <p class="pcard__brand" id="brand"></p>
      <h1 id="title"></h1>
      <p class="buy__price price" id="price"></p>
      <p class="buy__lead" id="line"></p>

      <fieldset class="opt" id="color-opt">
        <legend>Màu <span id="color-name"></span></legend>
        <div class="swatches" id="swatches"></div>
      </fieldset>

      <fieldset class="opt" id="switch">
        <legend>Switch <span>· bấm 🎵 để nghe thử</span></legend>
        <div class="switches" id="switches"></div>
      </fieldset>

      <div class="buy__actions" id="buy-actions">
        <div class="qty"><button type="button" data-q="-1" aria-label="Bớt">−</button><output id="qty">1</output><button type="button" data-q="1" aria-label="Thêm">+</button></div>
        <button class="btn btn--primary" type="button" data-add>Thêm vào giỏ</button>
      </div>
      <p class="buy__note">Đặt cọc 100.000đ qua chuyển khoản, phần còn lại trả khi nhận hàng (COD).</p>

      <section class="specs" id="specs" aria-labelledby="specs-h">
        <h2 id="specs-h">Thông số kỹ thuật</h2>
        <dl id="spec-list"></dl>
      </section>
    </div>
  </div>
  <div style="height:160px"></div>
</main>

<div class="buybar" aria-hidden="true">
  <div class="wrap">
    <div style="min-width:0"><div class="buybar__name" id="bar-name"></div><div class="buybar__var" id="bar-var"></div></div>
    <span class="price" id="bar-price"></span>
    <button class="btn btn--primary" type="button" data-add tabindex="-1">Thêm vào giỏ</button>
  </div>
</div>

<script type="module" src="assets/system.js"></script>
<script type="module" src="assets/motion/motion.js"></script>
<script type="module">
  import { CATALOG, PRODUCT, vnd, cart, openCart, bindSoundButtons, isPhoto } from './app.js';
  const $ = (s) => document.querySelector(s);
  const qs = new URLSearchParams(location.search);
  const p = CATALOG.find((x) => x.id === qs.get('id')) || CATALOG[0];
  const kb = p.type === 'keyboard';
  const state = { color: p.colors?.find((c) => c.id === qs.get('color')) || p.colors?.[0], sw: kb ? PRODUCT.switches[0] : null, qty: 1, img: 0 };
  const imgs = () => (state.color ? state.color.imgs : p.imgs);

  document.title = `${p.name} | KeyHouse`;
  $('#brand').textContent = p.brand;
  $('#title').textContent = p.name;
  $('#bar-name').textContent = p.name;
  $('#line').textContent = p.line;
  $('#color-opt').hidden = !p.colors;
  $('#switch').hidden = !kb;
  if (p.colors) $('#swatches').innerHTML = p.colors.map((c) => `<button type="button" class="swatch" style="--c:${c.hex}" data-color="${c.id}" aria-label="${c.name}" aria-pressed="${c === state.color}"></button>`).join('');
  if (kb) $('#switches').innerHTML = PRODUCT.switches.map((s) => `
    <div class="sw" data-sound-host>
      <button type="button" class="sw__pick" data-sw="${s.id}" aria-pressed="${s === state.sw}">
        <span><strong>${s.name}</strong><small>${s.kind}</small></span>
        <span class="sw__price">${s.add ? '+' + vnd(s.add) : 'Giá gốc'}</span>
      </button>
      <button type="button" class="sw__play" data-sound="${s.id}" aria-label="Nghe thử ${s.name}">🎵</button>
    </div>`).join('');
  const specs = p.specs || [['Hãng', p.brand], ['Dòng', p.line], ['Bảo hành', '12 tháng, 1 đổi 1 trong 7 ngày']];
  $('#spec-list').innerHTML = specs.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');

  const price = () => p.price + (state.sw?.add || 0);
  const variant = () => [state.color && `Màu ${state.color.name}`, state.sw?.name].filter(Boolean).join(' · ') || 'Mặc định';
  function gallery() {
    const list = imgs(), src = list[state.img] || list[0];
    const main = $('#main-img');
    main.src = src; main.alt = `${p.name}${state.color ? ', màu ' + state.color.name : ''}`;
    $('.gallery__main').classList.toggle('is-photo', isPhoto(src));
    $('#thumbs').innerHTML = list.length > 1 ? list.map((s, i) => `<button type="button" data-img="${i}" aria-pressed="${i === state.img}" aria-label="Ảnh ${i + 1}" class="${isPhoto(s) ? 'is-photo' : ''}"><img src="${s}" alt=""></button>`).join('') : '';
  }
  function render() {
    $('#price').textContent = $('#bar-price').textContent = vnd(price());
    $('#bar-var').textContent = variant();
    if (state.color) $('#color-name').textContent = '· ' + state.color.name;
    $('#qty').textContent = state.qty;
  }
  const fade = (fn) => { const m = $('.gallery__main'); m.classList.add('is-fading'); setTimeout(() => { fn(); m.classList.remove('is-fading'); }, 300); };

  document.addEventListener('click', (e) => {
    const sw = e.target.closest('[data-color]');
    if (sw) {
      state.color = p.colors.find((c) => c.id === sw.dataset.color);
      document.querySelectorAll('[data-color]').forEach((b) => b.setAttribute('aria-pressed', b === sw));
      fade(gallery); render();
    }
    const card = e.target.closest('[data-sw]');
    if (card) {
      state.sw = PRODUCT.switches.find((s) => s.id === card.dataset.sw);
      document.querySelectorAll('[data-sw]').forEach((b) => b.setAttribute('aria-pressed', b === card));
      render();
    }
    const th = e.target.closest('[data-img]');
    if (th) { state.img = +th.dataset.img; fade(gallery); }
    const q = e.target.closest('[data-q]');
    if (q) { state.qty = Math.max(1, Math.min(5, state.qty + +q.dataset.q)); render(); }
    if (e.target.closest('[data-add]')) {
      cart.add({ key: [p.id, state.color?.id, state.sw?.id].join(':'), title: p.name, variant: variant(), price: price(), qty: state.qty });
      openCart();
    }
  });
  bindSoundButtons();

  // sticky buy bar: shows once the add-to-cart row has scrolled above the screen
  const bar = $('.buybar');
  new IntersectionObserver(([e]) => {
    const on = !e.isIntersecting && e.boundingClientRect.top < 0;
    bar.classList.toggle('is-on', on);
    bar.setAttribute('aria-hidden', !on);
    bar.querySelector('button').tabIndex = on ? 0 : -1;
  }).observe($('#buy-actions'));
  gallery(); render();
</script>
</body>
</html>
