# Pull products from cms.weeblab.net every hour (or on demand) and commit the generated catalog.
# A commit to main redeploys GitHub Pages, so CMS edits reach the live site within ~1 hour.
name: CMS sync

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: cms-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          [ -n "$CMS_API_KEY" ] || { echo "::warning::CMS_API_KEY secret is not set (Settings > Secrets > Actions) - skipping"; exit 0; }
          npm run cms:sync
        env:
          CMS_API_KEY: ${{ secrets.CMS_API_KEY }}
          CMS_SITE_ID: 9be2d956-ef9c-4d41-bd55-3b8b6b1272a9
          CMS_CONTENT_TYPE_ID: cf49ba59-cbd0-4284-9872-5cb7549f3cef
      - name: Commit if the catalog changed
        run: |
          git diff --quiet -- landing/cms-catalog.js demo/cms-catalog.js && { echo "No CMS changes"; exit 0; }
          git config user.name "cms-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landing/cms-catalog.js demo/cms-catalog.js
          git commit -m "Sync products from CMS"
          git push
